
# .github/workflows/hello-multi-stage.yml
name: Hello World (QA → Prod with Approvals)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  qa:
    name: QA Stage
    runs-on: ubuntu-latest
    environment:
      name: qa
      # Optional: show a deployment URL in the environment panel
      # url: https://qa.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print QA message
        run: echo "Hello World qa"

      # Example: use environment-scoped secrets
      # - name: Use QA secret
      #   run: echo "Using ${{ secrets.QA_API_KEY }}"

  production:
    name: Production Stage
    runs-on: ubuntu-latest
    needs: qa
    # Only run Prod when on main (optional guard)
    environment:
      name: production
      # url: https://prod.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Production message
        run: echo "Hello World prod"

      # Example: use environment-scoped secrets
      # - name: Use Prod secret
      #   run: echo "Using ${{ secrets.PROD_API_KEY }}"
